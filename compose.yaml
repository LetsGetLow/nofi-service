services:
    php:
        restart: unless-stopped
        build:
            context: .  # Podman benötigt oft einen expliziten Build-Kontext
            dockerfile: Dockerfile.frankenphp
            target: prod
        ports:
            - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
            - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
            - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}/udp"
        environment:
            HTTP_PORT: "${HTTP_PORT:-8080}"
            HTTPS_PORT: "${HTTPS_PORT:-8443}"
            SERVER_NAME: "${SERVER_NAME:-localhost}"
            PHP_POST_MAX_SIZE: "${PHP_POST_MAX_SIZE:-32M}"
            PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-128M}"
        env_file:
            - path: .env.local
              required: false
        volumes:
            # 1. SELINUX FLAGS HINZUGEFÜGT (:ro,Z bzw. :Z)
            # Da du Passwörter/Zertifikate hineinlädst, ist :Z essenziell für Fedora
            - "./config/jwt:/app/config/jwt:ro,z"
            - "./config/firebase:/app/config/firebase:ro,z"
            - "var_data:/app/var"
        depends_on:
           database:
             condition: service_healthy # 2. ERZWINGE REIHENFOLGE (Wichtig für Podman-Netzwerke)
        healthcheck:
           test: ["CMD", "curl", "-fsSkL", "https://localhost:${HTTPS_PORT:-8443}/health"]
           timeout: 5s
           interval: 10s
           retries: 3
           start_period: 30s

    messenger-worker:
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile.frankenphp
            target: prod
        env_file:
            - path: .env.local
              required: false
        environment:
            PHP_MEMORY_LIMIT: "${PHP_WORKER_MEMORY_LIMIT:-256M}"
        volumes:
            # 1. SELINUX FLAGS HINZUGEFÜGT
            - "./config/firebase:/app/config/firebase:ro,z"
            - "var_data:/app/var"
        command: php bin/console messenger:consume async -vv --memory-limit=${MESSENGER_MEMORY_LIMIT:-160M}
        deploy:
            replicas: ${MESSENGER_NUM_WORKERS:-8}
        depends_on:
            database:
              condition: service_healthy # 2. ERZWINGE REIHENFOLGE
        healthcheck:
            test: ["CMD", "pgrep", "-f", "messenger:consume"]
            timeout: 5s
            interval: 10s
            retries: 3
            start_period: 10s

    ###> doctrine/doctrine-bundle ###
    database:
        restart: unless-stopped
        # 3. VOLLSTÄNDIGER REGISTRY-PFAD (Vermeidet Podman-Rückfragen beim Pull)
        image: docker.io/library/postgres:${POSTGRES_VERSION:-16}-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-app}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
            POSTGRES_USER: ${POSTGRES_USER:-app}
        healthcheck:
            test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
            timeout: 5s
            retries: 5
            start_period: 60s
        volumes:
            - database_data:/var/lib/postgresql/data:rw
            # Falls du die auskommentierte Zeile unten nutzt, füge auch dort unbedingt ein :Z an!
            # - ./docker/db/data:/var/lib/postgresql/data:Z

volumes:
    database_data:
    var_data:
