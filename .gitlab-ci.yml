# The pipeline runs everything inside an image built from this repository's own
# Dockerfile, rather than a public PHP image with the extensions listed a second
# time. The application needs sodium for the argon2id hashing in security.yaml,
# pdo_sqlite for the test database and pdo_pgsql for the migrations job, and
# stating that twice is how CI and a developer's ./docker drift apart.
#
# See README.md, "Continuous integration".

stages:
  - image
  - quality
  - database

variables:
  # The image every job after the first one runs in, built from this commit.
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci:$CI_COMMIT_SHA
  CI_IMAGE_CACHE: $CI_REGISTRY_IMAGE/ci:latest

# Every push is checked, wherever it lands. The middle rule is what keeps that
# from costing twice: a branch that already has an open merge request is
# covered by the merge request pipeline, and without the "never" each push
# would start both that one and a branch pipeline for the same commit.
#
# Note that a branch pipeline and a merge request pipeline do not see the same
# thing. The merge request one runs against the merge result, so it can fail on
# a conflict with the target branch that the branch pipeline is blind to, and
# it is the one worth requiring before a merge.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build-ci-image:
  stage: image
  image: docker:cli
  # This runner exposes the host's Docker daemon to its containers, so there is
  # no dind service here and no TLS to configure. A docker:dind service was
  # tried first and could not start: it died with
  #
  #   failed to load listeners: can't create unix socket
  #   /var/run/docker.sock: device or resource busy
  #
  # because the path it wants to bind is already the mounted host socket. Every
  # docker command then failed with "Cannot connect to the Docker daemon at
  # tcp://docker:2376".
  #
  # If this ever moves to a runner without the socket mounted, dind is the way
  # back: add "services: [docker:dind]", set DOCKER_HOST to tcp://docker:2376
  # with DOCKER_TLS_CERTDIR=/certs, and make sure the runner is configured
  # privileged — dind needs it, and the iptables errors in that failed job
  # suggest this one is not.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # A minute between attempts, because what this waits out is a registry
    # coming back up, which takes tens of seconds rather than one. Five
    # attempts is four minutes of patience at worst, against a job timeout of
    # an hour.
    RETRY_ATTEMPTS: 5
    RETRY_DELAY: 60
  before_script:
    # Named up front, because the failure otherwise arrives as a connection
    # error against whatever DOCKER_HOST happens to be.
    - >
      test -S /var/run/docker.sock
      || { echo "No Docker socket at /var/run/docker.sock. See the comment in .gitlab-ci.yml."; exit 1; }
    # The registry answered 503 Service Unavailable twice in a row before
    # accepting a login on the third attempt, failing the pipeline at its very
    # first command. Every call to the registry gets retried now — but the
    # calls, not the job: "retry:" on the job would rebuild a broken
    # Dockerfile three times before giving up.
    #
    # before_script and script run in one shell, so this function is available
    # to both.
    - |
      retry() {
        label=$1
        shift
        attempt=1
        while true; do
          "$@" && return 0
          if [ "$attempt" -ge "$RETRY_ATTEMPTS" ]; then
            echo "$label: still failing after $RETRY_ATTEMPTS attempts, giving up."
            return 1
          fi
          # Said out loud, with the wait: a job that goes quiet for a minute
          # otherwise looks hung rather than patient.
          echo "$label: attempt $attempt of $RETRY_ATTEMPTS failed, retrying in ${RETRY_DELAY}s."
          attempt=$((attempt + 1))
          sleep "$RETRY_DELAY"
        done
      }
    - retry "registry login" docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # --cache-from needs the layers on the daemon, and a missing :latest is
    # normal on the first pipeline, so this may fail without failing us. The
    # daemon is shared with the host here, so it may also already hold them.
    - docker pull "$CI_IMAGE_CACHE" || true
    - >
      docker build
      --file Dockerfile.frankenphp
      --target ci
      --cache-from "$CI_IMAGE_CACHE"
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag "$CI_IMAGE"
      .
    # As registry-dependent as the login; the 503 simply happened to arrive
    # before this rather than during it.
    - retry "push $CI_IMAGE" docker push "$CI_IMAGE"
    # The cache tag only moves on the default branch, so a merge request cannot
    # poison what other pipelines build against.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_IMAGE" "$CI_IMAGE_CACHE"
        retry "push $CI_IMAGE_CACHE" docker push "$CI_IMAGE_CACHE"
      fi

# Jobs run against the checkout GitLab made, which is the commit under test,
# with the vendor the image built. A copy and not a symlink: __DIR__ inside
# autoload.php resolves symlinks, so a symlinked vendor would point the Symfony
# runtime back at /app and quietly test the image's copy of the source instead
# of this one.
.in-ci-image:
  image: $CI_IMAGE
  before_script:
    # rm first: cp -a into an existing directory would nest it as vendor/vendor.
    # GitLab's default GIT_CLEAN_FLAGS (-ffdx) removes a gitignored vendor, but
    # a runner configured without that would otherwise fail here obscurely.
    - rm -rf vendor && cp -a /app/vendor vendor
    # Both are gitignored, so a fresh clone has neither, and PHPUnit writes to
    # both: the SQLite database and the throwaway JWT keypair live under var/.
    - mkdir -p var .phpunit.cache

phpunit:
  extends: .in-ci-image
  stage: quality
  script:
    - vendor/bin/phpunit
  # tests/Live needs credentials, a network and a device, and is excluded twice
  # over — the "live" group in phpunit.dist.xml and a skip when
  # NOFI_LIVE_PUSH_TARGET is unset — so it can never break this job.

psalm:
  extends: .in-ci-image
  stage: quality
  script:
    # --no-cache because the container is thrown away anyway, and a stale cache
    # is the one way this job could disagree with a developer's run.
    - vendor/bin/psalm --no-cache

audit:
  extends: .in-ci-image
  stage: quality
  variables:
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache
  cache:
    key:
      files:
        - composer.lock
    paths:
      - .composer-cache
  script:
    # The only job that reaches the network: advisories are published
    # continuously, so this can turn red on a commit that changed nothing. That
    # is deliberate — it is how a new advisory gets noticed at all.
    - composer audit

lint:
  extends: .in-ci-image
  stage: quality
  script:
    - composer validate --no-check-publish
    - bin/console lint:yaml config
    - bin/console lint:twig templates
    # Resolves every service and argument, which the test suite does not: a
    # container that only breaks for a service no test instantiates fails here
    # instead of in production.
    - bin/console lint:container

migrations:
  extends: .in-ci-image
  stage: database
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: nofi
    POSTGRES_USER: nofi
    POSTGRES_PASSWORD: nofi
    DATABASE_URL: "postgresql://nofi:nofi@postgres:5432/nofi?serverVersion=16&charset=utf8"
  script:
    # The gap this job exists for. The suite builds its schema from the entity
    # metadata (tests/Support/InteractsWithDatabase.php) and runs on SQLite, so
    # a migration that is broken, misordered or drifted from the entities passes
    # every test. Here they are the only thing that builds the schema, on the
    # PostgreSQL the application actually runs on.
    - bin/console doctrine:migrations:migrate --no-interaction
    # Both halves: the mapping, and the schema the migrations just produced
    # against that mapping — which is what catches an entity changed without a
    # migration. messenger_messages has no entity mapping it and needs no
    # schema_filter for this to pass, which was checked against a database
    # built by nothing but these migrations rather than assumed.
    - bin/console doctrine:schema:validate
