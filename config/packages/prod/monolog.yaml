# sentry/sentry-symfony does not register a Monolog handler service, and
# monolog-bundle 4 has no built-in "sentry" handler type, so wire it here.
services:
    Sentry\Monolog\Handler:
        arguments:
            $hub: '@Sentry\State\HubInterface'
            $level: !php/const Monolog\Level::Error

monolog:
    handlers:
        main:
            type: fingers_crossed
            action_level: error
            handler: grouped
            excluded_http_codes: [404, 405]
            buffer_size: 50
        grouped:
            type: group
            members: [stderr, sentry]
        stderr:
            type: stream
            path: "php://stderr"
            level: warning
            formatter: monolog.formatter.json
        sentry:
            type: service
            id: Sentry\Monolog\Handler
